<!DOCTYPE html>
<html>
<head>
<base target="_top">
<style>
  :root {
    --inchiostro: #1c2024;
    --attenuato: #626d78;
    --riga: #dde1e6;
    --sfondo: #ffffff;
    --campo: #f6f7f9;
    --azione: #2f5d7c;
    --azione-scura: #244a63;
    --entrata: #1b5e20;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0 auto;
    max-width: 560px;
    padding: 16px 16px 32px 16px;
    font-family: Roboto, -apple-system, "Segoe UI", sans-serif;
    font-size: 16px;
    line-height: 1.45;
    color: var(--inchiostro);
    background: var(--sfondo);
  }

  .testa {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    margin-bottom: 12px;
  }
  h1 { font-size: 20px; font-weight: 500; margin: 0; }

  a.nuovo {
    display: inline-block;
    padding: 10px 14px;
    border-radius: 3px;
    background: var(--azione);
    color: #fff;
    font-weight: 500;
    text-decoration: none;
    white-space: nowrap;
  }
  a.nuovo:hover { background: var(--azione-scura); }

  /* 16px anche qui: sotto quella soglia i browser mobili zoomano sul campo. */
  input[type=search] {
    width: 100%;
    padding: 10px 11px;
    border: 1px solid var(--riga);
    border-radius: 3px;
    background: var(--campo);
    font: inherit;
    color: inherit;
  }

  a:focus-visible, input:focus-visible {
    outline: 2px solid var(--azione);
    outline-offset: 1px;
  }

  .conteggio { color: var(--attenuato); font-size: 14px; margin: 8px 0 4px 0; }

  .avviso {
    background: #fff8e1;
    color: #7a5c00;
    padding: 9px 11px;
    border-radius: 3px;
    margin-bottom: 12px;
  }

  ul { list-style: none; margin: 0; padding: 0; }
  li { border-bottom: 1px solid var(--riga); }

  /* L'intera riga e' il bersaglio del tap, non solo il testo. */
  a.riga {
    display: grid;
    grid-template-columns: 1fr auto;
    column-gap: 12px;
    padding: 11px 2px;
    color: inherit;
    text-decoration: none;
  }
  a.riga:active { background: var(--campo); }
  .descrizione { overflow-wrap: anywhere; }
  .data { grid-column: 1; color: var(--attenuato); font-size: 14px; }
  .importo {
    grid-column: 2;
    grid-row: 1 / span 2;
    align-self: center;
    text-align: right;
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }
  .importo small { display: block; font-size: 12px; }
  .entrata .importo { color: var(--entrata); }

  .vuoto { color: var(--attenuato); padding: 20px 0; }
</style>
</head>
<body>

<div class="testa">
  <h1>Movimenti</h1>
  <a class="nuovo" href="<?= urlNuovo ?>">Nuovo movimento</a>
</div>

<? if (avviso) { ?>
  <div class="avviso"><?= avviso ?></div>
<? } ?>

<? if (movimenti.length) { ?>

  <input type="search" id="cerca" placeholder="Cerca nella descrizione"
         aria-label="Cerca nella descrizione" autocomplete="off">
  <p class="conteggio" id="conteggio"><?= movimenti.length ?> movimenti</p>

  <ul id="elenco">
    <? for (var i = 0; i < movimenti.length; i++) { var m = movimenti[i]; ?>
      <li class="<?= m.entrata ? 'entrata' : '' ?>">
        <a class="riga" href="<?= m.link ?>">
          <span class="descrizione"><?= m.descrizione ?></span>
          <span class="data"><?= m.data ?></span>
          <span class="importo"><?= m.importo ?><? if (m.entrata) { ?><small>entrata</small><? } ?></span>
        </a>
      </li>
    <? } ?>
  </ul>
  <p class="vuoto" id="nessuno" style="display:none">Nessun movimento corrisponde alla ricerca.</p>

<? } else { ?>
  <p class="vuoto">Non ci sono ancora movimenti.</p>
<? } ?>

<script>
(function () {
  var cerca = document.getElementById('cerca');
  if (!cerca) return;

  var totale = <?= movimenti.length ?>;
  var righe = Array.prototype.slice.call(document.querySelectorAll('#elenco li'));

  // Minuscole e senza accenti: "perche" deve trovare "perché".
  function piano(s) {
    return String(s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
  }

  var testi = righe.map(function (li) {
    return piano(li.querySelector('.descrizione').textContent);
  });

  cerca.addEventListener('input', function () {
    var q = piano(cerca.value.trim());
    var visibili = 0;
    righe.forEach(function (li, i) {
      var si = !q || testi[i].indexOf(q) !== -1;
      li.style.display = si ? '' : 'none';
      if (si) visibili++;
    });
    document.getElementById('conteggio').textContent = q
      ? visibili + ' di ' + totale + ' movimenti'
      : totale + ' movimenti';
    document.getElementById('nessuno').style.display = visibili ? 'none' : 'block';
  });
})();
</script>
</body>
</html>
